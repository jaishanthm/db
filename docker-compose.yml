services:
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: malware-intel-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=sqlite:///data/malware_intel.db
      - CORS_ORIGINS=*
      - SQL_MAX_ROWS=300
      - SQL_TIMEOUT_SECONDS=3.0
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: malware-intel-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
